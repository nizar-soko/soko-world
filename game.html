<!DOCTYPE html>
<html lang="pt-PT"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#170408">
<title>Soko World · pre-game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap">
<style>
@font-face{font-family:"Zalando Sans";src:url(a/ZalandoSans.woff2) format("woff2");font-weight:200 900;font-display:swap}
@font-face{font-family:"Oswald";src:url(a/Oswald-Regular.woff2) format("woff2");font-weight:400;font-display:swap}

:root{
  --bg:#160407;--ink:#f9f0f0;--muted:rgba(249,240,240,.62);
  --grad:#ffb8cb;
  --ca:#a597ff;--cb:#f68686;--ta:0;--tb:0;--px:0;--py:0;
  --f:"Zalando Sans","Inter",-apple-system,"SF Pro Display","Helvetica Neue",Roboto,Arial,sans-serif;
  --spring:cubic-bezier(.2,1.45,.4,1);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
@font-face{font-family:"Season Sans";src:url(a/SeasonSans-TRIAL-Regular.woff2) format("woff2");font-weight:400 500;font-display:swap}
@font-face{font-family:"Season Sans";src:url(a/SeasonSans-TRIAL-SemiBold.woff2) format("woff2");font-weight:500 700;font-display:swap}
@font-face{font-family:"Season Sans";src:url(a/SeasonSans-TRIAL-Bold.woff2) format("woff2");font-weight:500 900;font-display:swap}
@font-face{font-family:"Season Mix";src:url(a/SeasonMixTRIAL-Regular.woff2) format("woff2");font-weight:100 900;font-display:swap}
:root{--sk-ink:#3b0f18;--sk-paper:#f9f0f0;--sk-pink:#ffb8cb;--sk-pinkm:#ef8ea8;--sk-green:#b0ef8b;--sk-blue:#8bdfff;--sk-lilac:#e08efb;--sk-yellow:#ede77d;--sk-purple:#a597ff;--sk-dark:#170408}
html,body{height:100%;background:#160407;color:var(--ink);font-family:var(--f);overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

/* Mobile frame: full screen on phones, phone-sized column on desktop */
#app{position:fixed;top:0;bottom:0;left:50%;width:min(100vw,430px);transform:translateX(-50%);overflow:hidden;background:var(--bgc,#160407);isolation:isolate}
@media (min-width:600px){#app{top:2vh;bottom:2vh;border-radius:36px;box-shadow:0 0 0 10px #312228,0 40px 120px rgba(0,0,0,.8)}}
#app.shake{animation:shake .38s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{translate:-1px 0}20%,80%{translate:2px 1px}30%,50%,70%{translate:-3px -1px}40%,60%{translate:3px 1px}}

/* Background layers */
.layer{position:absolute;inset:0;pointer-events:none}
#pat{inset:-120px;background-image:var(--bgpat);background-size:var(--bgsz,64px);opacity:calc(var(--bgop,.16)*.6)}
@keyframes drift{to{transform:translate(var(--bgsz-n,64px),var(--bgsz-n,64px))}}
#tintA{background:radial-gradient(75% 60% at 0% 50%,color-mix(in srgb,var(--ca) 60%,transparent),transparent 72%);opacity:0;will-change:opacity}
#tintB{background:radial-gradient(75% 60% at 100% 50%,color-mix(in srgb,var(--cb) 60%,transparent),transparent 72%);opacity:0;will-change:opacity}
#vig{background:radial-gradient(110% 75% at 50% 45%,transparent 35%,rgba(0,0,0,.72))}
#pulse{opacity:0;background:radial-gradient(60% 50% at 50% 50%,var(--pc,#f9f0f0),transparent 70%)}
#pulse.go{animation:pulse .7s ease-out}
@keyframes pulse{0%{opacity:.55}100%{opacity:0}}
#flash{background:#f9f0f0;opacity:0}
#flash.go{animation:flash .45s ease-out}
@keyframes flash{0%{opacity:.5}100%{opacity:0}}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
#decor{z-index:1;filter:blur(2.5px) saturate(.85);opacity:.5;will-change:transform}
#pat{filter:blur(1.2px);will-change:transform}

/* UI column */
.ui{position:absolute;inset:0;display:flex;flex-direction:column;z-index:10;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.top{display:flex;align-items:center;gap:8px;padding:14px 14px 6px;position:relative;z-index:40}
.logo{display:flex;align-items:center;line-height:1;color:var(--sk-pink)}.logo .wm{height:19px;width:auto;display:block}
.logo small{font-weight:500;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);-webkit-text-fill-color:var(--muted);margin-left:5px;vertical-align:2px;font-family:'Oswald',var(--f);font-weight:400}
.langs{margin-left:auto;display:flex;gap:2px;padding:3px;border-radius:999px;background:rgba(255,255,255,.08);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.langs button{font-weight:500;font-size:11px;letter-spacing:.04em;padding:7px 9px;border-radius:6px;color:var(--muted);transition:color .2s,background .2s,transform .2s var(--spring)}
.langs button.on{background:var(--sk-pink);color:#160407}
.langs button:active{transform:scale(.9)}
.mute{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);transition:transform .2s var(--spring)}
.mute:active{transform:scale(.88)}
.mute svg{width:17px;height:17px}
.prog{display:flex;gap:6px;padding:6px 16px 0}
.prog i{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden;position:relative}
.prog i::after{content:"";position:absolute;inset:0;background:var(--grad);transform:scaleX(0);transform-origin:left;transition:transform .5s var(--spring)}
.prog i.on::after{transform:scaleX(1)}
.prog.hide{opacity:0}

.stage{flex:1;position:relative;display:grid;place-items:center;perspective:900px;min-height:0}
.inner{position:relative;width:min(84vw,350px);height:min(68vh,550px)}
#stack{position:absolute;inset:0}
.hover{position:absolute;inset:0;animation:hov var(--hov,6s) ease-in-out infinite}
@keyframes hov{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-10px) rotate(.6deg)}}

/* Hovering frames */
.frame{position:absolute;inset:-14px;border-radius:38px;padding:7px;background-color:var(--fc);background-image:var(--cardpat);background-size:var(--cpsz,36px);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);opacity:var(--fo,.28);transition:opacity .4s;will-change:transform}
.frame.f1{animation:fr1 var(--fr,7s) ease-in-out infinite}
@keyframes fr1{0%,100%{transform:rotate(-2.5deg) scale(1)}50%{transform:rotate(2deg) scale(1.02)}}
@keyframes fr2{0%,100%{transform:rotate(3deg)}50%{transform:rotate(-2deg) scale(.98)}}

/* Cards */
.card{position:absolute;inset:0;border-radius:30px;padding:11px;background-color:var(--cbase);background-image:var(--cardpat);background-size:var(--cpsz,36px);box-shadow:0 30px 60px -18px rgba(0,0,0,.75),inset 0 0 0 1px rgba(255,255,255,.12);touch-action:none;will-change:transform;transform-origin:50% 100%;transition:transform .32s var(--spring),opacity .2s}
.card::after{content:"";position:absolute;inset:0;border-radius:30px;background:#000;opacity:0;transition:opacity .25s;pointer-events:none}
.card.back1::after{opacity:.42}.card.back2::after{opacity:.58}
.card .face{position:relative;height:100%;border-radius:21px;background:var(--face);color:var(--fink);padding:20px 22px 18px;display:flex;flex-direction:column;overflow:visible}
.card .face::before{content:"";position:absolute;inset:0;border-radius:21px;background:radial-gradient(80% 50% at 50% 0%,rgba(255,255,255,.09),transparent 70%);pointer-events:none}
.ctop{display:flex;align-items:center;justify-content:space-between}
.num{font-weight:500;font-size:12px;letter-spacing:.16em;opacity:.65}
.emb{width:34px;height:34px}
.q{font-weight:500;font-size:clamp(28px,7.8vw,34px);line-height:1.04;letter-spacing:-.03em;margin:20px 0 0;text-wrap:balance}
/* electric walls */
.rail{position:absolute;top:20px;bottom:20px;width:3px;z-index:2;pointer-events:none}
.rail.a{left:-1.5px;--rc:var(--ca);--s:var(--sa,0)}
.rail.b{right:-1.5px;--rc:var(--cb);--s:var(--sb,0)}
.rail .line{position:absolute;inset:0;width:3px;border-radius:3px;overflow:hidden;
  background:linear-gradient(to bottom,transparent,var(--rc) 18%,var(--rc) 82%,transparent);opacity:calc(.35 + var(--s)*.65);box-shadow:0 0 8px var(--rc)}
.rail .line::after{content:"";position:absolute;left:0;right:0;top:0;height:26%;background:linear-gradient(to bottom,transparent,#f9f0f0 50%,transparent);will-change:transform;animation:zapd 2.6s cubic-bezier(.55,0,.45,1) infinite}
.rail.a .line::after{animation-name:zapu;animation-delay:-1.3s}
@keyframes zapd{0%{transform:translateY(-110%);opacity:0}12%{opacity:1}70%{transform:translateY(390%);opacity:.9}100%{transform:translateY(390%);opacity:0}}
@keyframes zapu{0%{transform:translateY(390%);opacity:0}12%{opacity:1}70%{transform:translateY(-110%);opacity:.9}100%{transform:translateY(-110%);opacity:0}}
/* options pinned to their own wall, read horizontally */
.lab{position:absolute;z-index:3;width:max-content;max-width:76%;padding:13px 16px;font-weight:500;font-size:20px;line-height:1.08;letter-spacing:-.015em;color:#160407;cursor:pointer;
  background:var(--rc);
  box-shadow:0 6px 16px -8px rgba(0,0,0,.45);
  opacity:calc(1 - var(--o2)*.6);transition:transform .2s var(--spring),opacity .15s}
.lab.a{left:0;bottom:150px;--rc:var(--ca);--s:var(--sa,0);--o2:var(--sb,0);text-align:left;border-radius:6px;transform-origin:left center;transform:scale(calc(1 + var(--s)*.1));translate:0 0;animation:edgeA 2.6s ease-in-out infinite -1.3s}
.lab.b{right:0;bottom:44px;--rc:var(--cb);--s:var(--sb,0);--o2:var(--sa,0);text-align:right;border-radius:6px;transform-origin:right center;transform:scale(calc(1 + var(--s)*.1));animation:edgeB 2.6s ease-in-out infinite}
@keyframes edgeA{0%,80%,100%{translate:0 0}88%{translate:-3px 0}}
@keyframes edgeB{0%,80%,100%{translate:0 0}88%{translate:3px 0}}
@keyframes flick{0%,100%{opacity:calc(1 - var(--o2)*.6)}91%{opacity:.6}92%{opacity:calc(1 - var(--o2)*.6)}94%{opacity:.75}95%{opacity:calc(1 - var(--o2)*.6)}}
.tip{display:block;max-height:0;opacity:0;overflow:hidden;margin-top:0;font-weight:500;font-size:14px;line-height:1.2;letter-spacing:-.01em;color:var(--fink);white-space:normal;transition:max-height .22s ease-out,opacity .18s,margin-top .22s;pointer-events:none}
.lab.b .tip{text-align:right}.lab .tip{color:#160407;opacity:.75;font-weight:400}
.tip.on{max-height:90px;opacity:.92;margin-top:7px}
.stamp{position:absolute;top:44%;padding:6px 12px;border:3px solid;border-radius:12px;font-weight:500;font-size:22px;letter-spacing:-.01em;text-transform:uppercase;opacity:0;pointer-events:none;white-space:nowrap;max-width:80%;overflow:hidden;text-overflow:ellipsis;font-family:'Oswald',var(--f);font-weight:400}
.stamp.a{right:16px;color:var(--ca);border-color:var(--ca);transform:rotate(12deg) scale(calc(.7 + var(--sa,0)*.4));opacity:var(--sa,0)}
.stamp.b{left:16px;color:var(--cb);border-color:var(--cb);transform:rotate(-12deg) scale(calc(.7 + var(--sb,0)*.4));opacity:var(--sb,0)}
/* slow motion line between cards */
#hover{transition:opacity .3s}
#app.slowing #hover{opacity:.08}
#slowmo{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:20;padding:0 30px;text-align:center}
#slowmo .t{font-weight:500;font-size:clamp(32px,9.4vw,42px);line-height:1.05;letter-spacing:-.03em;color:#f9f0f0;text-wrap:balance;
  text-shadow:0 0 34px color-mix(in srgb,var(--sc) 80%,transparent),0 6px 30px rgba(0,0,0,.7);animation:smDrift var(--hold,2s) linear forwards;position:relative;padding-bottom:16px}
#slowmo .t::after{content:"";position:absolute;left:10%;right:10%;bottom:0;height:3px;border-radius:3px;background:var(--sc);box-shadow:0 0 12px var(--sc);transform:scaleX(0);transform-origin:calc(50% - var(--sd)*50%) 50%;animation:smBar var(--hold,2s) cubic-bezier(.3,0,.2,1) forwards}
@keyframes smBar{to{transform:scaleX(1)}}
#slowmo .w{display:inline-block;opacity:0;filter:blur(10px);transform:translateY(16px) scale(.9);animation:smIn .9s cubic-bezier(.2,.7,.2,1) forwards}
#slowmo.out .t{animation:smOut .4s ease-in forwards}
@keyframes smIn{to{opacity:1;filter:blur(0);transform:none}}
@keyframes smDrift{from{translate:calc(var(--sd)*-12px) 0;scale:1}to{translate:calc(var(--sd)*12px) 0;scale:1.06}}
@keyframes smOut{to{opacity:0;filter:blur(12px);transform:scale(1.15) translateY(-12px)}}
.card.back1{transform:translateY(18px) scale(.94)}
.card.back2{transform:translateY(34px) scale(.88)}
.card.enter{transform:translateY(-120%) rotate(-8deg);opacity:0}
.card.nudge{animation:nudge 1s ease-in-out}
@keyframes nudge{20%{transform:rotate(-5deg) translateX(-12px)}50%{transform:rotate(5deg) translateX(12px)}80%{transform:rotate(-1deg)}}
.swap{animation:swap .35s var(--spring)}
@keyframes swap{0%{opacity:0;transform:translateY(8px) scale(.96)}100%{opacity:1;transform:none}}

/* Bottom */
.bottom{padding:8px 16px 10px}
.acts{display:flex;gap:10px}
.act{flex:1;min-height:54px;padding:10px 12px;border-radius:18px;font-weight:500;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;background:rgba(22,4,7,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.12);transition:transform .2s var(--spring),background .2s}
.act:active{transform:scale(.94)}
.act.a{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--ca) 75%,transparent)}
.act.b{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--cb) 75%,transparent)}
.act .dot{width:9px;height:9px;border-radius:50%;flex:none}
.act.a .dot{background:var(--ca)}.act.b .dot{background:var(--cb)}
.hint{text-align:center;font-weight:500;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:2px;font-family:'Oswald',var(--f);font-weight:400}
.bottom.hide{opacity:0;pointer-events:none;transform:translateY(20px);transition:.35s}
.bottom{transition:opacity .35s,transform .35s var(--spring)}

/* Test bar */
.test{display:flex;flex-wrap:wrap;align-items:center;gap:6px;justify-content:center;padding:6px 10px 8px;font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:rgba(249,240,240,.45);font-family:'Oswald',var(--f);font-weight:400}
.test button{padding:5px 8px;border-radius:8px;background:rgba(255,255,255,.06);font-weight:500;font-size:10px;letter-spacing:.06em;color:rgba(249,240,240,.6)}
.test button.on{background:rgba(255,255,255,.2);color:#f9f0f0}

/* Intro portal */
.portal{position:absolute;inset:0;border-radius:30px;padding:11px;background-color:var(--cbase);background-image:var(--cardpat);background-size:var(--cpsz,36px);box-shadow:0 30px 70px -18px rgba(0,0,0,.8);transition:transform .5s cubic-bezier(.5,0,.75,0),opacity .45s,filter .45s}
.portal .face{height:100%;border-radius:21px;background:var(--face);color:var(--fink);padding:22px 20px 18px;display:flex;flex-direction:column;text-align:center;align-items:center}
.portal .kick{font-weight:500;font-size:12px;letter-spacing:.16em;text-transform:uppercase;opacity:.7;font-family:'Oswald',var(--f);font-weight:400}
.mascot{width:72%;max-height:34%;margin:14px 0 6px;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-3deg)}}
.phrase{font-weight:500;font-size:clamp(25px,7vw,31px);line-height:1.05;letter-spacing:-.03em;margin:auto 0;text-wrap:balance}
.sub{font-weight:500;font-size:13.5px;opacity:.75;margin-bottom:14px}
.cta{width:100%;min-height:56px;border-radius:6px;background:var(--sk-yellow);color:#160407;font-family:'Zalando Sans',system-ui,sans-serif;font-weight:400;font-size:18px;letter-spacing:.02em;box-shadow:none;transition:transform .2s var(--spring)}
.cta:active{transform:scale(.95)}
.snd{font-size:11px;font-weight:500;opacity:.55;margin-top:10px;letter-spacing:.06em}
.portal.out{transform:scale(1.35) translateY(-20px);opacity:0;filter:blur(10px)}

/* Loader + done */
.loader,.done{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0;pointer-events:none;transition:opacity .35s}
.loader.on,.done.on{opacity:1;pointer-events:auto}
.orb{width:170px;height:170px;border-radius:50%;position:relative;background:conic-gradient(from 0deg,var(--ca),#ede77d,#ffb8cb,#e08efb,var(--cb),var(--ca));animation:spin 1.1s linear infinite;filter:blur(.3px);box-shadow:0 0 80px color-mix(in srgb,var(--cb) 60%,transparent)}
.orb::after{content:"";position:absolute;inset:14px;border-radius:50%;background:var(--bgc,#160407)}
.orb i{position:absolute;inset:-18px;border-radius:50%;border:2px solid rgba(255,255,255,.25);animation:ring 1.1s ease-out infinite}
.orb i:nth-child(2){animation-delay:.37s}.orb i:nth-child(3){animation-delay:.74s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ring{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.lline{margin-top:34px;font-weight:500;font-size:24px;letter-spacing:-.02em;min-height:30px}
.lline.swap{animation:swap .3s var(--spring)}
.done .face{width:min(84vw,350px);border-radius:28px;padding:26px 22px 20px;background:var(--face);color:var(--fink);box-shadow:0 30px 60px -18px rgba(0,0,0,.75),0 0 0 9px var(--cbase)}
.done h2{font-weight:500;font-size:30px;line-height:1.04;letter-spacing:-.03em}
.done p{font-weight:500;font-size:15px;opacity:.78;margin:10px 0 18px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:20px}
.chips span{padding:7px 11px;border-radius:999px;font-weight:500;font-size:12.5px;background:color-mix(in srgb,var(--fink) 10%,transparent)}
.replay{margin-top:12px;font-weight:500;font-size:12px;opacity:.6;text-decoration:underline}
.toast{position:absolute;left:50%;bottom:110px;transform:translate(-50%,20px);padding:10px 14px;border-radius:12px;background:#f9f0f0;color:#160407;font-weight:500;font-size:13px;opacity:0;transition:.3s var(--spring);z-index:40;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* Decor */
.dz{position:absolute;pointer-events:none}
.tile{width:46px;height:46px;border-radius:6px;background-color:#f9f0f0;background-size:46px;box-shadow:0 8px 20px rgba(0,0,0,.4);transform:rotate(var(--r,10deg))}
@keyframes tilef{0%,100%{transform:translateY(0) rotate(var(--r,10deg))}50%{transform:translateY(-22px) rotate(calc(var(--r,10deg)*-1))}}
.waves{left:-80px;right:-80px;bottom:0;height:70px;background-size:80px 26px;opacity:.28}
@keyframes wv{to{transform:translateX(80px)}}
.sun{left:50%;top:48%;width:150%;aspect-ratio:1;translate:-50% -50%;opacity:.22}
.picado{top:62px;left:-10px;right:-10px;height:60px;display:flex;justify-content:space-between;padding:0 6px}
.picado::before{content:"";position:absolute;left:0;right:0;top:6px;height:2px;background:rgba(255,255,255,.35)}
.flag{width:10%;margin-top:6px;transform-origin:50% 0;transform:rotate(var(--fr0,0deg));opacity:.92}
@keyframes sw{0%,100%{transform:rotate(calc(var(--amp,6deg)*-1))}50%{transform:rotate(var(--amp,6deg))}}
.leaf{transform-origin:var(--o,50% 100%);transform:rotate(var(--r0,0deg))}
@keyframes lf{0%,100%{transform:rotate(var(--r0,0deg))}50%{transform:rotate(calc(var(--r0,0deg) + var(--amp,7deg)))}}

/* Intensity levels */
#app.l1{--hov:4.6s;--fr:5.4s;--fo:.36;--drift:26s;--sunt:40s;--amp:9deg}
#app.l2{--hov:3.4s;--fr:3.8s;--fo:.46;--drift:15s;--sunt:22s;--amp:13deg}
#app.l3{--hov:2.2s;--fr:2.4s;--fo:.6;--drift:8s;--sunt:9s;--amp:18deg}

/* ---------- GAMES ---------- */
#game{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;padding:6px 16px 10px;z-index:15}
#game.on{display:flex}
.ghud{width:min(88vw,370px);display:flex;align-items:center;gap:10px;margin-bottom:7px}
.gscore{font-weight:500;font-size:22px;letter-spacing:-.02em;min-width:86px;font-variant-numeric:tabular-nums}
.gscore small{font-size:11px;font-weight:500;letter-spacing:.12em;opacity:.55;margin-left:3px}
.gtime{flex:1;height:8px;border-radius:8px;background:rgba(255,255,255,.12);overflow:hidden}
.gtime i{display:block;height:100%;width:100%;background:var(--grad);transform-origin:left;will-change:transform}
.gcombo{font-weight:500;font-size:14px;min-width:40px;text-align:right;color:var(--cb)}

function admPanel(){let o=$('#admp');if(!o){o=document.createElement('div');o.id='admp';app.appendChild(o);try{Object.assign(ADM,JSON.parse(localStorage.getItem('sw_admp')||'{}'))}catch(e){}
  if(qs.get('m'))ADM.m=S.m;if(qs.get('lang'))ADM.lang=S.lang;
  fetch(TTM.url+'/geo/places').then(r=>r.json()).then(j=>{ADM._pl=j;draw()}).catch(()=>{});
  o.addEventListener('click',e=>{const b=e.target.closest('[data-k],[data-act]');if(!b)return;const k=b.dataset.k,v=b.dataset.v;
   if(k){ADM[k]=(v==='true'?true:v==='false'?false:v);if(k==='m')ADM.lang=MK[v].lang;if(k==='mode')ADM.game='';draw();return}
   const act=b.dataset.act;if(act==='close'){o.classList.remove('on');return}
   if(act==='reset'){try{['sw_vseen','sw_did','sw_admp'].forEach(x=>localStorage.removeItem(x))}catch(e){}toast('Device data cleared');return}
   save();location.href=admUrl(act==='win'?'win':act==='fail'?'fail':'')});
  o.addEventListener('change',e=>{const t=e.target;if(t.dataset.f){ADM[t.dataset.f]=t.value.trim();save();if(t.tagName==='SELECT')draw()}})}
 const save=()=>{try{const c=Object.assign({},ADM);delete c._pl;localStorage.setItem('sw_admp',JSON.stringify(c))}catch(e){}};

 function draw(){const a=ADM,g=a.mode==='hunt'||a.mode==='real',games=ADMG[a.mode]||[],pl=a._pl||{};
  o.innerHTML=`<div class="w"><div class="alb"><span>SOKO WORLD · ADMIN</span><button data-act="close" aria-label="close">×</button></div><h2>Control panel</h2>
  <h3>Market</h3>${chips('m',Object.keys(MK).map(k=>[k,MK[k].name]))}
  <h3>Language</h3>${chips('lang',[['pt','PT'],['br','PT-BR'],['es','ES'],['en','EN']])}
  <h3>Mode</h3><div class="md">${[['arcade','Simple','Arcade games'],['sit','Spicy','Situational games'],['strange','Strange','Corridor and Zen'],['hunt','Sokemon','Camera hunt, level 3'],['real','Real path','As a player sees it, no test tools']].map(([v,t,d])=>`<button data-k="mode" data-v="${v}" class="${a.mode===v?'on':''}"><b>${t}</b><small>${d}</small></button>`).join('')}</div>
  ${a.mode==='hunt'?'':`<h3>Venue type</h3>${chips('zone',[['','Shuffle'],['culture','Culture'],['food','Food'],['music','Music'],['night','Night'],['after','Outdoors'],['fallback','Public QR']])}`}
  ${g?'':`<h3>Game</h3><select data-f="game"><option value="">Auto (by venue type)</option>${games.map(x=>`<option value="${x}" ${a.game===x?'selected':''}>${ADMN[x]||x}</option>`).join('')}</select>
  <h3>Player profile (skips the pregame cards)</h3>${chips('age',[['u','Under 25'],['o','25+']])}<div style="height:6px"></div>${chips('vibe',[['bored','Bored'],['surprise','Surprise me']])}<div style="height:6px"></div>${chips('look',[['something','A new spot'],['someone','New faces']])}
  <h3>Options</h3><div class="ch">${[['ttm','Talk to Me',a.mode==='sit'],['story','Intro story',true],['inv','Inverted controls',true],['px','Pixel look',a.mode==='sit']].filter(x=>x[2]).map(([k,l])=>`<button data-k="${k}" data-v="${!a[k]}" class="${a[k]?'on':''}">${l}: ${a[k]?'on':'off'}</button>`).join('')}</div>`}
  <h3>Place lock</h3><select data-f="geo"><option value="">Off (opens anywhere)</option>${Object.keys(pl).map(id=>`<option value="${id}" ${a.geo===id?'selected':''}>${pl[id].name}${pl[id].area?' · '+pl[id].area:''} (${pl[id].r} m)</option>`).join('')}</select>
  ${a.geo?`<div style="height:6px"></div><input data-f="geotest" placeholder="Test code to skip the location check" value="${clEsc(a.geotest||'')}"><div class="note">With a place selected, the game only opens within its radius. The test code lets you in from anywhere.</div>`:''}
  <h3>Tools</h3><div class="tl"><a href="redeem.html" target="_blank">Venue redeem page</a><a href="backoffice.html" target="_blank">Backoffice</a><a href="game.html?alpha=1">Alpha path</a><button data-act="reset">Reset this device</button></div>
  <div class="note">Reset clears this device's wording memory and Talk to Me device id. Win and fail screens include the gift and claim demo.</div>
  </div><div class="go">${g?'':'<button data-act="fail">Fail screen</button><button data-act="win">Win screen</button>'}<button class="main" data-act="play">Play ▸</button></div>`}
 o.classList.add('on');draw()}

let rzT;addEventListener('resize',()=>{fxSize();clearTimeout(rzT);rzT=setTimeout(paintBg,150)});fxSize();drawMute();theme();drawTest();start();track('sw_qr_open',{referrer:document.referrer||null});
