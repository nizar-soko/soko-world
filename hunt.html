<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Sokemon · Soko World</title>
<style>
@font-face{font-family:"Zalando Sans";src:url(a/ZalandoSans.woff2) format("woff2");font-weight:200 900;font-display:swap}
@font-face{font-family:"Oswald";src:url(a/Oswald-Regular.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Season Mix";src:url(a/SeasonMixTRIAL-Regular.woff2) format("woff2");font-weight:100 900;font-display:swap}
:root{--ink:#160407;--dark:#3b0f18;--paper:#f9f0f0;--pink:#ffb8cb;--lilac:#a597ff;--yellow:#ede77d;--green:#b0ef8b;--blue:#8bdfff;--coral:#f68686}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);color:var(--paper);font-family:"Zalando Sans",system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
#cam,#fb,#cv{position:fixed;inset:0;width:100%;height:100%}#cam,#fb{z-index:0}#cv{z-index:2}#shade{z-index:1}.top,.hint,.tray{z-index:3}#dbg{position:fixed;left:8px;top:50%;z-index:9;font:11px monospace;background:rgba(0,0,0,.6);padding:4px 6px;border-radius:6px;display:none;white-space:pre}
#cam{object-fit:cover;background:#000}
#fb{background:linear-gradient(180deg,#4a3f9e,#8f82ec 55%,#e7a3c4);display:none}
#shade{position:fixed;inset:0;background:radial-gradient(circle at 50% 45%,transparent 30%,rgba(22,4,7,.55));pointer-events:none}
.top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 14px) 18px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.k{font-family:Oswald,sans-serif;letter-spacing:.14em;text-transform:uppercase;font-size:11px;opacity:.85}
.pts{font-family:"Season Mix",serif;font-size:30px;line-height:1}
.hint{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 76px);text-align:center;font-family:"Season Mix",serif;font-size:21px;padding:0 26px;text-shadow:0 2px 14px rgba(0,0,0,.6);pointer-events:none;transition:opacity .4s}
.tray{position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 14px);background:rgba(22,4,7,.6);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.16);border-radius:22px;padding:12px 14px 14px}
.tray .k{display:flex;justify-content:space-between}
.slots{display:flex;gap:8px;margin-top:10px}
.slot{flex:1;aspect-ratio:1;border-radius:14px;border:1.5px dashed rgba(255,255,255,.3);display:grid;place-items:center;position:relative;transition:all .4s}
.slot img{width:86%;height:86%;object-fit:contain;filter:brightness(0) invert(1);opacity:.22;transition:opacity .4s,filter .4s,transform .5s cubic-bezier(.2,1.6,.4,1)}
.slot.got{border:1.5px solid rgba(255,255,255,.55);background:rgba(255,255,255,.1)}.slot.got img{opacity:1;filter:none;transform:scale(1.12)}
.slot.rare{border-color:var(--yellow)}.slot.rare::after{content:'?';position:absolute;font-family:"Season Mix",serif;font-size:22px;color:var(--yellow)}
.slot.rare img{opacity:0}
.sheet{position:fixed;inset:0;display:grid;place-items:center;padding:22px;background:rgba(22,4,7,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);z-index:5;transition:opacity .4s}
.sheet.off{opacity:0;pointer-events:none}
.card{width:100%;max-width:360px;background:var(--paper);color:var(--ink);border-radius:28px;padding:28px 24px 22px;text-align:center}
.card .k{color:#764d4d}.card h1{font-family:"Season Mix",serif;font-weight:400;font-size:38px;line-height:1;margin:8px 0 12px;letter-spacing:-.02em}
.card p{font-size:15px;line-height:1.35;margin:0 0 8px;opacity:.85}
.card button{font:inherit;font-size:18px;font-weight:500;width:100%;margin-top:14px;padding:16px;border:0;border-radius:12px;background:var(--pink);color:var(--ink)}
.card small{display:block;margin-top:10px;font-size:12px;opacity:.6}
.rarebox{margin:14px 0 2px;padding:12px;border-radius:14px;background:var(--dark);color:var(--paper);font-size:14px;line-height:1.3}.rarebox b{color:var(--yellow);font-weight:500}
</style></head><body>
<video id="cam" playsinline muted autoplay></video><div id="fb"></div><canvas id="cv"></canvas><div id="shade"></div>
<div class="top"><div><div class="k" id="tk"></div><div class="k" id="tp" style="opacity:.6;margin-top:3px"></div></div><div style="text-align:right"><div class="k" id="tl"></div><div class="pts" id="pts">0</div></div></div>
<div class="hint" id="hint"></div><div id="dbg"></div>

<div class="sheet off" id="end"><div class="card"><div class="k" id="ek"></div><h1 id="eh"></h1><p id="ep"></p><div class="rarebox" id="er"></div><button id="again"></button><small id="es"></small></div></div>

<script>

pt:{tk:'A caça · demo',tl:'pontos',tw:'O padrão desta semana',ik:'Soko World · nível 3',ih:'Sokemon',ip:'A malta da Soko está escondida nesta sala. Olha à volta com o telemóvel, encontra uma figura no chão e mantém-na no anel até ela desistir.',go:'Abrir a câmara',is:'Demo. Precisa de acesso à câmara e ao movimento.',find:'Olha à volta. Está aqui alguém…',hold:'Mantém-na no anel',slip:'A malta da Soko está escondida nesta sala. Olha à volta com o telemóvel, encontra uma figura no chão e mantém-na no anel até ela desistir.',got:['Apanhada.','Já é tua.','Bem apanhada.'],next:'Apareceu outra',ek:'3 de 5 apanhadas',eh:'Quase',ep:'Ganhaste {p} pontos esta noite. Os pontos abrem mais jogos pequenos enquanto persegues o padrão completo.',er:'<b>Ainda faltam duas.</b> Uma esconde-se num sítio de comida antes do meio-dia. A última só aparece num sítio de música depois da meia-noite.',again:'Jogar a demo outra vez',es:'Só demo. Nada fica guardado.',drag:'Sem sensor de movimento. Arrasta para olhar à volta.',up:'Olha um pouco para cima',down:'Olha para baixo. Está no chão',turn:'Segue a seta. Roda o telemóvel'},
br:{tk:'A caça · demo',tl:'pontos',tw:'O padrão desta semana',ik:'Soko World · nível 3',ih:'Sokemon',ip:'A galera da Soko está escondida nesta sala. Olha em volta com o celular, acha uma figura no chão e mantém ela no anel até ela desistir.',go:'Abrir a câmera',is:'Demo. Precisa de acesso à câmera e ao movimento.',find:'Olha em volta. Tem alguém aqui…',hold:'Mantém ela no anel',slip:'A galera da Soko está escondida nesta sala. Olha em volta com o celular, acha uma figura no chão e mantém ela no anel até ela desistir.',got:['Pegou.','Agora é sua.','Bela pegada.'],next:'Apareceu mais uma',ek:'3 de 5 coletadas',eh:'Quase',ep:'Você ganhou {p} pontos hoje. Os pontos liberam mais jogos pequenos enquanto você corre atrás do padrão completo.',er:'<b>Ainda faltam duas.</b> Uma se esconde num lugar de comida antes do meio-dia. A última só aparece num lugar de música depois da meia-noite.',again:'Jogar a demo de novo',es:'Só demo. Nada fica salvo.',drag:'Sem sensor de movimento. Arrasta para olhar em volta.',up:'Olha um pouco pra cima',down:'Olha pra baixo. Está no chão',turn:'Segue a seta. Vira o celular'},
es:{tk:'La cacería · demo',tl:'puntos',tw:'El patrón de esta semana',ik:'Soko World · nivel 3',ih:'Sokemon',ip:'La gente de Soko está escondida en este lugar. Mira alrededor con tu celular, encuentra una figura en el piso y mantenla en el anillo hasta que se rinda.',go:'Abrir la cámara',is:'Demo. Necesita acceso a la cámara y al movimiento.',find:'Mira alrededor. Aquí hay alguien…',hold:'Mantenla en el anillo',slip:'La gente de Soko está escondida en este lugar. Mira alrededor con tu celular, encuentra una figura en el piso y mantenla en el anillo hasta que se rinda.',got:['Atrapada.','Ya es tuya.','Buena atrapada.'],next:'Apareció otra',ek:'3 de 5 atrapadas',eh:'Casi',ep:'Ganaste {p} puntos esta noche. Los puntos abren más juegos pequeños mientras persigues el patrón completo.',er:'<b>Todavía faltan dos.</b> Una se esconde en un lugar de comida antes del mediodía. La última solo aparece en un lugar de música después de la medianoche.',again:'Jugar la demo otra vez',es:'Solo demo. Nada se guarda.',drag:'Sin sensor de movimiento. Arrastra para mirar alrededor.',up:'Mira un poco hacia arriba',down:'Mira hacia abajo. Está en el piso',turn:'Sigue la flecha. Gira tu celular'}}[lang];
const $=s=>document.querySelector(s);const DBG=qs.get('dbg')==='1';
['tk','tl','tw','ik','ih','ip','go','is','ek','eh','again','es'].forEach(k=>$('#'+k).textContent=T[k]);$('#er').innerHTML=T.er;

// ---- real Soko characters (from the Soko brand files)
const CH=[{id:'reader',c:'#ffb8cb'},{id:'camera',c:'#8bdfff'},{id:'bag',c:'#ede77d'},{id:'dancer',c:'#a597ff'},{id:'sitter',c:'#ede77d'}];
CH.forEach(c=>{c.img=new Image();c.img.src='a/ch/'+c.id+'.webp'});
const slots=$('#slots');
CH.forEach((c,i)=>{const d=document.createElement('div');d.className='slot'+(i===4?' rare':'');const im=document.createElement('img');im.src='a/ch/'+c.id+'.webp';im.alt='';d.appendChild(im);slots.appendChild(d)});

// ---- view + world
const cv=$('#cv'),ctx=cv.getContext('2d');let W=0,H=0,DPR=Math.min(2,devicePixelRatio||1);
function fit(){W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',fit);fit();
const V={yaw:0,pitch:-20,ty:0,tp:-20,gyro:false,base:null};
const CAMH=1.45,CHH=1.0,KK=()=>W/52,DEG=180/Math.PI;
// a point on or above the floor: bearing (deg), distance (m), height above floor (m) -> screen
function P3(b,d,z){const k=KK();return{x:W/2-wrap(b-V.yaw)*k,y:H*.45-(Math.atan2(z-CAMH,d)*DEG-V.pitch)*k}}
const wrap=d=>((d+540)%360)-180;
function onOri(e){if(e.alpha==null||e.beta==null)return;V.gyro=true;V.n=(V.n||0)+1;const d=Math.PI/180,a=e.alpha*d,b=e.beta*d,g=(e.gamma||0)*d;
 const vx=-Math.sin(g)*Math.cos(a)-Math.cos(g)*Math.sin(b)*Math.sin(a),vy=-Math.sin(g)*Math.sin(a)+Math.cos(g)*Math.sin(b)*Math.cos(a),vz=-Math.cos(g)*Math.cos(b);
 const pit=Math.asin(Math.max(-1,Math.min(1,vz)))/d;if(Math.abs(vz)<.94){const yaw=Math.atan2(-vx,vy)/d;if(V.base==null)V.base=yaw;V.ty=wrap(yaw-V.base)}V.tp=Math.max(-75,Math.min(75,pit))}
let drag=null;cv.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY]});addEventListener('pointerup',()=>drag=null);
addEventListener('pointermove',e=>{if(!drag||V.gyro)return;V.ty=wrap(V.ty+(e.clientX-drag[0])*.22);V.tp=Math.max(-50,Math.min(50,V.tp+(e.clientY-drag[1])*.18));drag=[e.clientX,e.clientY]});

// ---- audio
let AC=null;function tone(f,d,g,type,to){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),a=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);a.gain.setValueAtTime(0,t);a.gain.linearRampToValueAtTime(g,t+.01);a.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(a).connect(AC.destination);o.start(t);o.stop(t+d+.02)}
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};

// ---- game
const G={on:false,i:0,pts:0,got:[],sh:null,charge:0,inRing:false,msgT:0,fly:null,parts:[],t:0,seen:false};
function hint(s){const h=$('#hint');h.style.opacity=0;setTimeout(()=>{h.textContent=s;h.style.opacity=1},180)}
function spawn(){const far=G.i===0?12:G.i===1?40:60+Math.random()*25,dir=Math.random()<.5?-1:1;
 G.sh={k:G.i,b:wrap(V.yaw+dir*far),d:G.i===0?2.3:1.9+Math.random()*1.5,z:0,hop:null,ph:Math.random()*9,born:G.t,face:dir,tell:0,dT:1.4};G.charge=0;G.seen=false;G.aSide=null;hint(G.i?T.next:T.find)}
function body(s){const f=P3(s.b,s.d,s.z),h=P3(s.b,s.d,s.z+CHH);return{fx:f.x,fy:f.y,hy:h.y,ht:f.y-h.y,x:f.x,y:(f.y+h.y)/2}}
function proj(s){return body(s)}
function caught(){const s=G.sh,p=body(s);G.fly={k:s.k,x:p.x,y:p.y,ht:p.ht,t:0};G.sh=null;const add=50+G.i*25;G.pts+=add;$('#pts').textContent=G.pts;G.got.push(s.k);
 for(let i=0;i<26;i++){const a=Math.random()*7,sp=1+Math.random()*5;G.parts.push({x:p.x,y:p.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,l:1,c:['#ffb8cb','#ede77d','#f9f0f0','#a597ff'][i%4]})}
 [0,4,7,12].forEach((n,i)=>setTimeout(()=>tone(440*Math.pow(2,n/12),.5,.12),i*70));buzz([20,40,60]);hint(T.got[G.i%3]+'  +'+add);
 G.i++;setTimeout(()=>{if(G.i>=3)finish();else spawn()},1500)}
function finish(){G.on=false;$('#ep').textContent=T.ep.replace('{p}',G.pts);$('#end').classList.remove('off')}
function floor(){ // faint dots on the floor plane, fixed in the room: they are what makes things feel anchored
 const k=KK();ctx.fillStyle='#fff';for(let r=1.2;r<=5.2;r+=.8){const n=Math.round(r*7);for(let i=0;i<n;i++){const b=i*360/n+(r*37%20),dy=wrap(b-V.yaw);if(Math.abs(dy)>34)continue;const q=P3(b,r,0);if(q.y<H*.2||q.y>H-150)continue;ctx.globalAlpha=.16*(1-r/6.5);ctx.beginPath();ctx.ellipse(q.x,q.y,2.6-r*.3,(2.6-r*.3)*.45,0,0,7);ctx.fill()}}ctx.globalAlpha=1}
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;G.t+=dt;requestAnimationFrame(loop);
 V.yaw=wrap(V.yaw+wrap(V.ty-V.yaw)*Math.min(1,dt*12));V.pitch+=(V.tp-V.pitch)*Math.min(1,dt*12);
 ctx.clearRect(0,0,W,H);const cx=W/2,cy=H*.45,R=Math.min(W,H)*.2,k=KK();
 if(G.on)floor();
 const s=G.sh;let p=null;
 if(s&&G.on){p=body(s);const vis=p.x>-40&&p.x<W+40&&p.hy<H&&p.fy>0;
  // hop: shake first (the tell), then one readable jump across the floor
  if(s.hop){const h=s.hop;h.t+=dt/h.dur;const e=Math.min(1,h.t),ee=e<.5?2*e*e:1-Math.pow(-2*e+2,2)/2;s.b=wrap(h.b0+wrap(h.b1-h.b0)*ee);s.d=h.d0+(h.d1-h.d0)*ee;s.z=Math.sin(e*Math.PI)*h.lift;if(e>=1){s.hop=null;s.z=0;s.land=.22;tone(180,.12,.06,'sine',110);buzz(8)}}
  else if(vis&&G.inRing){s.dT-=dt;if(s.dT<=0&&!s.tell){s.tell=.38;tone(900,.08,.04,'triangle')}}
  if(!vis){s.tell=0;s.dT=1.2}
  if(s.tell){s.tell-=dt;if(s.tell<=0){s.tell=0;const dir=Math.random()<.5?-1:1,jump=(13+G.i*6)*(.8+Math.random()*.5);s.face=dir;s.hop={t:0,dur:.5-G.i*.04,b0:s.b,b1:wrap(s.b+dir*jump),d0:s.d,d1:Math.max(1.8,Math.min(3.6,s.d+(Math.random()-.5)*1.2)),lift:.38+Math.random()*.15};s.dT=Math.max(.9,2.3-G.i*.45)+Math.random()*.9;tone(520,.18,.05,'sine',760)}}
  if(s.land)s.land=Math.max(0,s.land-dt);
  p=body(s);const d=Math.hypot(p.x-cx,p.y-cy),was=G.inRing;G.inRing=d<R*.95;
  if(G.inRing){if(!was){tone(520,.12,.05);if(!G.seen){G.seen=true;hint(T.hold)}}G.charge+=dt/(1.5+G.i*.35);if(Math.random()<dt*14)buzz(6)}else{if(was&&G.charge>.15){hint(T.slip);tone(300,.25,.05,'sine',180)}G.charge=Math.max(0,G.charge-dt*.5)}
  if(G.charge>=1){caught();p=null}}
 // character standing on the floor
 if(G.sh&&p){const s=G.sh,c=CH[s.k],im=c.img,on=p.x>-80&&p.x<W+80&&p.hy<H+40&&p.fy>-40,ap=Math.min(1,(G.t-s.born)/.5);
  if(on&&im.complete&&im.naturalWidth){const gf=P3(s.b,s.d,0),ht=p.ht*1.12,wd=ht*im.naturalWidth/im.naturalHeight,up=s.z/.5,sl=Math.abs(Math.sin(Math.atan2(CAMH,s.d)));
   // landing pad + contact shadow on the floor
   ctx.save();ctx.globalAlpha=.5*ap;ctx.strokeStyle=c.c;ctx.lineWidth=2;ctx.setLineDash([5,7]);ctx.lineDashOffset=-G.t*14;const pr=Math.atan2(.55,s.d)*DEG*k;ctx.beginPath();ctx.ellipse(gf.x,gf.y,pr,pr*sl,0,0,7);ctx.stroke();ctx.restore();
   ctx.save();ctx.globalAlpha=.42*ap*(1-up*.55);ctx.fillStyle='#160407';ctx.filter='blur(5px)';ctx.beginPath();ctx.ellipse(gf.x,gf.y,wd*.36*(1-up*.3),wd*.36*sl*(1-up*.3),0,0,7);ctx.fill();ctx.restore();
   // the character: breathes, leans into hops, squashes on landing
   const sq=s.land?1-Math.sin(s.land/.22*Math.PI)*.14:1+Math.sin(G.t*2.6+s.ph)*.025,st=s.hop?1+Math.sin(Math.min(1,s.hop.t)*Math.PI)*.08:1;
   ctx.save();ctx.translate(p.fx,p.fy);ctx.globalAlpha=ap;ctx.rotate((s.tell?Math.sin(G.t*55)*.07:Math.sin(G.t*1.7+s.ph)*.025)+(s.hop?-s.face*.12*Math.sin(Math.min(1,s.hop.t)*Math.PI):0));ctx.scale((s.face<0?-1:1)*(2-sq*st),sq*st);
   ctx.shadowColor='rgba(0,0,0,.4)';ctx.shadowBlur=14;ctx.shadowOffsetY=4;ctx.drawImage(im,-wd/2,-ht,wd,ht);ctx.restore()}
  else if(!on){const dy=wrap(s.b-V.yaw);if(G.aSide==null||Math.abs(dy)<150)G.aSide=dy>0?-1:1;const horiz=p.x<-60||p.x>W+60,a=horiz?(G.aSide<0?Math.PI:0):(p.y<cy?-Math.PI/2:Math.PI/2),ex=horiz?(G.aSide<0?40:W-40):cx,ey=horiz?cy:(p.y<cy?130:H-200);ctx.save();ctx.translate(ex,ey);ctx.rotate(a);ctx.globalAlpha=.6+.4*Math.sin(G.t*6);ctx.fillStyle=c.c;ctx.beginPath();ctx.moveTo(26,0);ctx.lineTo(-14,-19);ctx.lineTo(-5,0);ctx.lineTo(-14,19);ctx.closePath();ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=10;ctx.fill();ctx.restore();if(!G.offT||G.t-G.offT>4){G.offT=G.t;hint(horiz?T.turn:(p.y<cy?T.up:T.down))}}}
 // ring
 ctx.lineWidth=2;ctx.strokeStyle='rgba(255,255,255,'+(G.inRing?.9:.45)+')';ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.stroke();
 if(G.charge>0&&G.sh){ctx.lineWidth=6;ctx.lineCap='round';ctx.strokeStyle=CH[G.sh.k].c;ctx.beginPath();ctx.arc(cx,cy,R+7,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.min(1,G.charge));ctx.stroke()}
