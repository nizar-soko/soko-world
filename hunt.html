<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Sokemon · Soko World</title>
<style>
@font-face{font-family:"Zalando Sans";src:url(a/ZalandoSans.woff2) format("woff2");font-weight:200 900;font-display:swap}
@font-face{font-family:"Oswald";src:url(a/Oswald-Regular.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Season Mix";src:url(a/SeasonMixTRIAL-Regular.woff2) format("woff2");font-weight:100 900;font-display:swap}
:root{--ink:#160407;--dark:#3b0f18;--paper:#f9f0f0;--pink:#ffb8cb;--lilac:#a597ff;--yellow:#ede77d;--green:#b0ef8b;--blue:#8bdfff;--coral:#f68686}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);color:var(--paper);font-family:"Zalando Sans",system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
#cam,#fb,#cv{position:fixed;inset:0;width:100%;height:100%}#cam,#fb{z-index:0}#cv{z-index:2}#shade{z-index:1}.top,.hint,.tray{z-index:3}#dbg{position:fixed;left:8px;top:50%;z-index:9;font:11px monospace;background:rgba(0,0,0,.6);padding:4px 6px;border-radius:6px;display:none;white-space:pre}
#cam{object-fit:cover;background:#000}
#fb{background:linear-gradient(180deg,#4a3f9e,#8f82ec 55%,#e7a3c4);display:none}
#shade{position:fixed;inset:0;background:radial-gradient(circle at 50% 45%,transparent 30%,rgba(22,4,7,.55));pointer-events:none}
.top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 14px) 18px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.k{font-family:Oswald,sans-serif;letter-spacing:.14em;text-transform:uppercase;font-size:11px;opacity:.85}
.pts{font-family:"Season Mix",serif;font-size:30px;line-height:1}
.hint{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 76px);text-align:center;font-family:"Season Mix",serif;font-size:21px;padding:0 26px;text-shadow:0 2px 14px rgba(0,0,0,.6);pointer-events:none;transition:opacity .4s}
.tray{position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 14px);background:rgba(22,4,7,.6);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.16);border-radius:22px;padding:12px 14px 14px}
.tray .k{display:flex;justify-content:space-between}
.slots{display:flex;gap:8px;margin-top:10px}
.slot{flex:1;aspect-ratio:1;border-radius:14px;border:1.5px dashed rgba(255,255,255,.3);display:grid;place-items:center;position:relative;transition:all .4s}
.slot img{width:86%;height:86%;object-fit:contain;filter:brightness(0) invert(1);opacity:.22;transition:opacity .4s,filter .4s,transform .5s cubic-bezier(.2,1.6,.4,1)}
.slot.got{border:1.5px solid rgba(255,255,255,.55);background:rgba(255,255,255,.1)}.slot.got img{opacity:1;filter:none;transform:scale(1.12)}
.slot.rare{border-color:var(--yellow)}.slot.rare::after{content:'?';position:absolute;font-family:"Season Mix",serif;font-size:22px;color:var(--yellow)}
.slot.rare img{opacity:0}
.sheet{position:fixed;inset:0;display:grid;place-items:center;padding:22px;background:rgba(22,4,7,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);z-index:5;transition:opacity .4s}
.sheet.off{opacity:0;pointer-events:none}
.card{width:100%;max-width:360px;background:var(--paper);color:var(--ink);border-radius:28px;padding:28px 24px 22px;text-align:center}
.card .k{color:#764d4d}.card h1{font-family:"Season Mix",serif;font-weight:400;font-size:38px;line-height:1;margin:8px 0 12px;letter-spacing:-.02em}
.card p{font-size:15px;line-height:1.35;margin:0 0 8px;opacity:.85}
.card button{font:inherit;font-size:18px;font-weight:500;width:100%;margin-top:14px;padding:16px;border:0;border-radius:12px;background:var(--pink);color:var(--ink)}
.card small{display:block;margin-top:10px;font-size:12px;opacity:.6}
.rarebox{margin:14px 0 2px;padding:12px;border-radius:14px;background:var(--dark);color:var(--paper);font-size:14px;line-height:1.3}.rarebox b{color:var(--yellow);font-weight:500}

const $=s=>document.querySelector(s);const DBG=qs.get('dbg')==='1';
['tk','tl','tw','ik','ih','ip','go','is','ek','eh','again','es'].forEach(k=>$('#'+k).textContent=T[k]);$('#er').innerHTML=T.er;

// ---- real Soko characters (from the Soko brand files)
const CH=[{id:'reader',c:'#ffb8cb'},{id:'camera',c:'#8bdfff'},{id:'bag',c:'#ede77d'},{id:'dancer',c:'#a597ff'},{id:'sitter',c:'#ede77d'}];
CH.forEach(c=>{c.img=new Image();c.img.src='a/ch/'+c.id+'.webp'});
const slots=$('#slots');
CH.forEach((c,i)=>{const d=document.createElement('div');d.className='slot'+(i===4?' rare':'');const im=document.createElement('img');im.src='a/ch/'+c.id+'.webp';im.alt='';d.appendChild(im);slots.appendChild(d)});

// ---- view + world
const cv=$('#cv'),ctx=cv.getContext('2d');let W=0,H=0,DPR=Math.min(2,devicePixelRatio||1);
function fit(){W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',fit);fit();
const V={yaw:0,pitch:-20,roll:0,ty:0,tp:-20,tr:0,uy:0,gyro:false,base:null,h:[]};
const CAMH=1.45,CHH=.62,DEG=180/Math.PI,RAD=Math.PI/180,cam=$('#cam');
// camera lock: reads the camera picture to learn the real lens angle and the camera delay, then keeps the drawing glued to the picture
const TR={on:qs.get('lock')!=='0',k:0,L:.07,rx:0,ry:0,ax:0,ay:0,conf:0,lum:.5,E:new Float64Array(11),En:0,sxy:0,sxx:0,pt:0,nf:false,src:null};
const KK=()=>TR.k||W/52,wrap=d=>((d+540)%360)-180;
// a point in the room: bearing (deg), distance (m), height above floor (m) -> screen, through a real lens model (k = px per degree at the centre)
function PJ(b,d,z,yaw,pit,rol,k){const f=k*DEG,ph=wrap(b-yaw)*RAD,th=pit*RAD,ro=rol*RAD,xr=-d*Math.sin(ph),fw=d*Math.cos(ph),up=z-CAMH,dep=fw*Math.cos(th)+up*Math.sin(th),yc=-fw*Math.sin(th)+up*Math.cos(th);
 if(dep<.05)return{x:ph>0?-9999:W+9999,y:H*.45,back:true};const xs=xr*Math.cos(ro)-yc*Math.sin(ro),ys=xr*Math.sin(ro)+yc*Math.cos(ro);return{x:W/2+f*xs/dep,y:H*.45-f*ys/dep}}
function P3(b,d,z){const q=PJ(b,d,z,V.yaw,V.pitch,V.roll,KK());if(!q.back){q.x+=TR.ax;q.y+=TR.ay}return q}
// where the phone was pointing at time t (ms), from the recent sensor history
function samp(t){const h=V.h,n=h.length;if(!n)return{uy:V.uy,p:V.tp,r:V.tr};if(t>=h[n-1].t)return h[n-1];for(let i=n-2;i>=0;i--)if(h[i].t<=t){const a=h[i],b=h[i+1],u=(t-a.t)/(b.t-a.t||1);return{uy:a.uy+(b.uy-a.uy)*u,p:a.p+(b.p-a.p)*u,r:a.r+wrap(b.r-a.r)*u}}return h[0]}
function onOri(e){if(e.alpha==null||e.beta==null)return;V.gyro=true;V.n=(V.n||0)+1;const d=RAD,a=e.alpha*d,b=e.beta*d,g=(e.gamma||0)*d;
 const vx=-Math.sin(g)*Math.cos(a)-Math.cos(g)*Math.sin(b)*Math.sin(a),vy=-Math.sin(g)*Math.sin(a)+Math.cos(g)*Math.sin(b)*Math.cos(a),vz=-Math.cos(g)*Math.cos(b);
 const pit=Math.asin(Math.max(-1,Math.min(1,vz)))/d;
 if(Math.abs(vz)<.94){const yaw=Math.atan2(-vx,vy)/d;if(V.base==null)V.base=yaw;const ny=wrap(yaw-V.base);V.uy+=wrap(ny-V.ty);V.ty=ny;
  // tilt of the phone against the horizon, so characters stay upright in the room
  const n=Math.hypot(vx,vy)||1,rx=vy/n,ry=-vx/n,Yx=-Math.sin(a)*Math.cos(b),Yy=Math.cos(a)*Math.cos(b),Yz=Math.sin(b);V.tr=Math.atan2(Yx*rx+Yy*ry,(Yx*ry-Yy*rx)*vz+Yz*(rx*vy-ry*vx))/d}
 V.tp=Math.max(-75,Math.min(75,pit));V.h.push({t:performance.now(),uy:V.uy,p:V.tp,r:V.tr});if(V.h.length>64)V.h.shift()}
// --- picture tracker: how far did the camera picture slide since the last frame?
const TW=80,TM=22,TRR=5;let TH=0,tcv=null,tcx=null,ga=null,gb=null;const TS=new Float64Array(121);
function grab(){const v=TR.src||cam,vw=v.videoWidth||v.width,vh=v.videoHeight||v.height;if(!vw||!vh)return false;
 if(!tcv||TR.w!==W||TR.hh!==H){TR.w=W;TR.hh=H;TH=Math.max(60,Math.round(TW*H/W));tcv=document.createElement('canvas');tcv.width=TW;tcv.height=TH;tcx=tcv.getContext('2d',{willReadFrequently:true});ga=new Uint8Array(TW*TH);gb=new Uint8Array(TW*TH);TR.pt=0}
 const s=Math.max(W/vw,H/vh),sw=W/s,sh=H/s;try{tcx.drawImage(v,(vw-sw)/2,(vh-sh)/2,sw,sh,0,0,TW,TH)}catch(e){return false}
 const d=tcx.getImageData(0,0,TW,TH).data,t=ga;ga=gb;gb=t;let m=0;for(let i=0,j=0;j<gb.length;i+=4,j++)m+=gb[j]=(d[i]*2+d[i+1]*5+d[i+2])>>3;TR.lum+=(m/gb.length/255-TR.lum)*.2;return true}
function match(px,py){const lim=TM-TRR,cx0=Math.max(-lim,Math.min(lim,Math.round(px))),cy0=Math.max(-lim,Math.min(lim,Math.round(py)));let best=1e18,bi=0,bj=0,sum=0,n=0;
 for(let j=-TRR;j<=TRR;j++)for(let i=-TRR;i<=TRR;i++){const sx=cx0+i,sy=cy0+j;let s=0;for(let y=TM;y<TH-TM;y+=2){let o=y*TW+TM,o2=(y+sy)*TW+TM+sx;for(let x=TM;x<TW-TM;x++){const q=gb[o2++]-ga[o++];s+=q<0?-q:q}}TS[(j+TRR)*11+i+TRR]=s;sum+=s;if(s<best){best=s;bi=i;bj=j}}
 n=(TW-2*TM)*Math.ceil((TH-2*TM)/2);const mean=sum/121;let c=mean/n<1.2?0:Math.max(0,Math.min(1,((1-best/mean)-.12)/.3));if(Math.abs(bi)===TRR||Math.abs(bj)===TRR)c*=.3;
 let fx=0,fy=0;const id=(bj+TRR)*11+bi+TRR;if(Math.abs(bi)<TRR){const l=TS[id-1],r=TS[id+1],dn=l-2*best+r;if(dn>0)fx=.5*(l-r)/dn}if(Math.abs(bj)<TRR){const l=TS[id-11],r=TS[id+11],dn=l-2*best+r;if(dn>0)fy=.5*(l-r)/dn}
 return{x:cx0+bi+fx,y:cy0+bj+fy,c}}
// how far the picture should have slid between two moments, for a given camera delay (in px at k=1)
function shiftU(t0,t1,lg){const a=samp(t0-lg),b=samp(t1-lg),c=Math.cos(a.p*RAD),q=PJ(a.uy,1e3*c,CAMH+1e3*Math.sin(a.p*RAD),b.uy,b.p,b.r,1);return q.back?[0,0]:[q.x-W/2,q.y-H*.45]}
function track(now){if(!TR.on||!V.gyro||V.h.length<4)return;if(!grab())return;const t0=TR.pt;TR.pt=now;if(!t0||now-t0>180)return;
 const sc=W/TW,k=KK(),u=shiftU(t0,now,TR.L*1000),m=match(u[0]*k/sc,u[1]*k/sc);TR.conf+=(m.c-TR.conf)*.2;if(m.c<.35)return;const mx=m.x*sc,my=m.y*sc,w=m.c;
 // 1) learn the camera delay: which delay makes the sensors explain the picture best
 let hi=0,bj=0;for(let j=0;j<11;j++){const v=shiftU(t0,now,j*20),ex=mx-v[0]*k,ey=my-v[1]*k;TR.E[j]=TR.E[j]*.985+(ex*ex+ey*ey)*w;if(TR.E[j]<TR.E[bj])bj=j;if(TR.E[j]>hi)hi=TR.E[j]}
 TR.En=TR.En*.985+(mx*mx+my*my)*w;if(TR.En>1500&&hi>0&&(hi-TR.E[bj])/hi>.3){let l=bj;if(bj>0&&bj<10){const a=TR.E[bj-1],b=TR.E[bj],c=TR.E[bj+1],dn=a-2*b+c;if(dn>0)l+=.5*(a-c)/dn}TR.L+=(l*.02-TR.L)*.04}
 // 2) learn the real lens angle: px of picture slide per degree of turn
 TR.sxy=TR.sxy*.985+(mx*u[0]+my*u[1])*w;TR.sxx=TR.sxx*.985+(u[0]*u[0]+u[1]*u[1])*w;if(TR.sxx>30){const kn=Math.max(W/85,Math.min(W/34,TR.sxy/TR.sxx));TR.k=k+(kn-k)*.05}
 // 3) whatever is left over, nudge the drawing so it stays glued to the picture
 const ex=mx-u[0]*k,ey=my-u[1]*k;if(Math.hypot(ex,ey)>.7){const lm=W*.12;TR.rx=Math.max(-lm,Math.min(lm,TR.rx+ex*.5*w));TR.ry=Math.max(-lm,Math.min(lm,TR.ry+ey*.5*w))}}
let drag=null;cv.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY]});addEventListener('pointerup',()=>drag=null);
addEventListener('pointermove',e=>{if(!drag||V.gyro)return;V.ty=wrap(V.ty+(e.clientX-drag[0])*.22);V.tp=Math.max(-50,Math.min(50,V.tp+(e.clientY-drag[1])*.18));drag=[e.clientX,e.clientY]});

// ---- audio
let AC=null;function tone(f,d,g,type,to){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),a=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);a.gain.setValueAtTime(0,t);a.gain.linearRampToValueAtTime(g,t+.01);a.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(a).connect(AC.destination);o.start(t);o.stop(t+d+.02)}
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};

// ---- game
const G={on:false,i:0,pts:0,got:[],sh:null,charge:0,inRing:false,msgT:0,fly:null,parts:[],t:0,seen:false};
function hint(s){const h=$('#hint');h.style.opacity=0;setTimeout(()=>{h.textContent=s;h.style.opacity=1},180)}
function spawn(){const far=G.i===1?40:60+Math.random()*25,dir=Math.random()<.5?-1:1,d0=G.d0||2.3,first=G.i===0;
 G.sh={k:G.i,b:first?(G.b0!=null?G.b0:wrap(V.yaw+dir*12)):wrap(V.yaw+dir*far),d:first?d0:Math.max(G.dmin||1.8,Math.min(G.dmax||3.6,d0*(.8+Math.random()*.55))),z:0,hop:null,ph:Math.random()*9,born:G.t,face:dir,tell:0,dT:.9,wT:1.2+Math.random()};G.charge=0;G.seen=false;G.aSide=null;hint(G.i?T.next:T.find)}
