<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Soko World · The Hunt (demo)</title>
<style>
@font-face{font-family:"Zalando Sans";src:url(a/ZalandoSans.woff2) format("woff2");font-weight:200 900;font-display:swap}
@font-face{font-family:"Oswald";src:url(a/Oswald-Regular.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Season Mix";src:url(a/SeasonMixTRIAL-Regular.woff2) format("woff2");font-weight:100 900;font-display:swap}
:root{--ink:#160407;--dark:#3b0f18;--paper:#f9f0f0;--pink:#ffb8cb;--lilac:#a597ff;--yellow:#ede77d;--green:#b0ef8b;--blue:#8bdfff;--coral:#f68686}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);color:var(--paper);font-family:"Zalando Sans",system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
#cam,#fb,#cv{position:fixed;inset:0;width:100%;height:100%}
#cam{object-fit:cover;background:#000}
#fb{background:linear-gradient(180deg,#4a3f9e,#8f82ec 55%,#e7a3c4);display:none}
#shade{position:fixed;inset:0;background:radial-gradient(circle at 50% 45%,transparent 30%,rgba(22,4,7,.55));pointer-events:none}
.top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 14px) 18px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.k{font-family:Oswald,sans-serif;letter-spacing:.14em;text-transform:uppercase;font-size:11px;opacity:.85}
.pts{font-family:"Season Mix",serif;font-size:30px;line-height:1}
.hint{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 76px);text-align:center;font-family:"Season Mix",serif;font-size:21px;padding:0 26px;text-shadow:0 2px 14px rgba(0,0,0,.6);pointer-events:none;transition:opacity .4s}
.tray{position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 14px);background:rgba(22,4,7,.6);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.16);border-radius:22px;padding:12px 14px 14px}
.tray .k{display:flex;justify-content:space-between}
.slots{display:flex;gap:8px;margin-top:10px}
.slot{flex:1;aspect-ratio:1;border-radius:14px;border:1.5px dashed rgba(255,255,255,.3);display:grid;place-items:center;position:relative;transition:all .4s}
.slot canvas{width:74%;height:74%;opacity:.22;transition:opacity .4s,transform .5s cubic-bezier(.2,1.6,.4,1)}
.slot.got{border:1.5px solid rgba(255,255,255,.55);background:rgba(255,255,255,.1)}.slot.got canvas{opacity:1;transform:scale(1.08)}
.slot.rare{border-color:var(--yellow)}.slot.rare::after{content:'?';position:absolute;font-family:"Season Mix",serif;font-size:22px;color:var(--yellow)}
.slot.rare canvas{opacity:0}
.sheet{position:fixed;inset:0;display:grid;place-items:center;padding:22px;background:rgba(22,4,7,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);z-index:5;transition:opacity .4s}
.sheet.off{opacity:0;pointer-events:none}
.card{width:100%;max-width:360px;background:var(--paper);color:var(--ink);border-radius:28px;padding:28px 24px 22px;text-align:center}
.card .k{color:#764d4d}.card h1{font-family:"Season Mix",serif;font-weight:400;font-size:38px;line-height:1;margin:8px 0 12px;letter-spacing:-.02em}
.card p{font-size:15px;line-height:1.35;margin:0 0 8px;opacity:.85}
.card button{font:inherit;font-size:18px;font-weight:500;width:100%;margin-top:14px;padding:16px;border:0;border-radius:12px;background:var(--pink);color:var(--ink)}
.card small{display:block;margin-top:10px;font-size:12px;opacity:.6}
.rarebox{margin:14px 0 2px;padding:12px;border-radius:14px;background:var(--dark);color:var(--paper);font-size:14px;line-height:1.3}.rarebox b{color:var(--yellow);font-weight:500}
</style></head><body>
<video id="cam" playsinline muted autoplay></video><div id="fb"></div><canvas id="cv"></canvas><div id="shade"></div>
<div class="top"><div><div class="k" id="tk"></div><div class="k" id="tp" style="opacity:.6;margin-top:3px"></div></div><div style="text-align:right"><div class="k" id="tl"></div><div class="pts" id="pts">0</div></div></div>
<div class="hint" id="hint"></div>
<div class="tray"><div class="k"><span id="tw"></span><span id="tc"></span></div><div class="slots" id="slots"></div></div>
<div class="sheet" id="intro"><div class="card"><div class="k" id="ik"></div><h1 id="ih"></h1><p id="ip"></p><button id="go"></button><small id="is"></small></div></div>
<div class="sheet off" id="end"><div class="card"><div class="k" id="ek"></div><h1 id="eh"></h1><p id="ep"></p><div class="rarebox" id="er"></div><button id="again"></button><small id="es"></small></div></div>
<script>
const qs=new URLSearchParams(location.search),lang=({pt:'pt',br:'br',es:'es'})[qs.get('lang')]||'en';
const T={en:{tk:'The hunt · demo',tp:'Passevite · Graça',tl:'points',tw:"This week's pattern",ik:'Soko World · level 3',ih:'The hunt',ip:'Soko shapes are hiding in this room. Look around with your phone, find one, and hold it in the ring until it gives up.',go:'Open the camera',is:'Demo. Needs camera and motion access.',find:'Look around. Something is here…',hold:'Hold it in the ring',slip:'It slipped away. Find it again',got:['Got it.','Yours now.','Clean catch.'],next:'Another one just appeared',ek:'3 of 5 collected',eh:'So close',ep:'You earned {p} points tonight. Points open more small games while you chase the full pattern.',er:'<b>Two shapes missing.</b> One hides in a food spot before noon. The last one only shows up in a music spot after midnight.',again:'Play the demo again',es:'Demo only. Nothing is saved.',drag:'No motion sensor here. Drag to look around.'},
pt:{tk:'A caça · demo',tp:'Passevite · Graça',tl:'pontos',tw:'O padrão desta semana',ik:'Soko World · nível 3',ih:'A caça',ip:'Há formas da Soko escondidas nesta sala. Olha à volta com o telemóvel, encontra uma e segura-a no anel até ela desistir.',go:'Abrir a câmara',is:'Demo. Precisa de acesso à câmara e ao movimento.',find:'Olha à volta. Há aqui qualquer coisa…',hold:'Segura-a no anel',slip:'Fugiu. Encontra-a outra vez',got:['Apanhada.','Já é tua.','Bem apanhada.'],next:'Apareceu outra',ek:'3 de 5 apanhadas',eh:'Quase',ep:'Ganhaste {p} pontos esta noite. Os pontos abrem mais jogos pequenos enquanto persegues o padrão completo.',er:'<b>Faltam duas formas.</b> Uma esconde-se num sítio de comida antes do meio-dia. A última só aparece num sítio de música depois da meia-noite.',again:'Jogar a demo outra vez',es:'Só demo. Nada fica guardado.',drag:'Sem sensor de movimento. Arrasta para olhar à volta.'},
br:{tk:'A caça · demo',tp:'Passevite · Graça',tl:'pontos',tw:'O padrão desta semana',ik:'Soko World · nível 3',ih:'A caça',ip:'Tem formas da Soko escondidas nesta sala. Olha em volta com o celular, acha uma e segura ela no anel até ela desistir.',go:'Abrir a câmera',is:'Demo. Precisa de acesso à câmera e ao movimento.',find:'Olha em volta. Tem alguma coisa aqui…',hold:'Segura ela no anel',slip:'Escapou. Acha ela de novo',got:['Pegou.','Agora é sua.','Bela pegada.'],next:'Apareceu mais uma',ek:'3 de 5 coletadas',eh:'Quase',ep:'Você ganhou {p} pontos hoje. Os pontos liberam mais jogos pequenos enquanto você corre atrás do padrão completo.',er:'<b>Faltam duas formas.</b> Uma se esconde num lugar de comida antes do meio-dia. A última só aparece num lugar de música depois da meia-noite.',again:'Jogar a demo de novo',es:'Só demo. Nada fica salvo.',drag:'Sem sensor de movimento. Arrasta para olhar em volta.'},
es:{tk:'La cacería · demo',tp:'Passevite · Graça',tl:'puntos',tw:'El patrón de esta semana',ik:'Soko World · nivel 3',ih:'La cacería',ip:'Hay formas de Soko escondidas en este lugar. Mira alrededor con tu celular, encuentra una y mantenla en el anillo hasta que se rinda.',go:'Abrir la cámara',is:'Demo. Necesita acceso a la cámara y al movimiento.',find:'Mira alrededor. Aquí hay algo…',hold:'Mantenla en el anillo',slip:'Se escapó. Encuéntrala otra vez',got:['Atrapada.','Ya es tuya.','Buena atrapada.'],next:'Apareció otra',ek:'3 de 5 atrapadas',eh:'Casi',ep:'Ganaste {p} puntos esta noche. Los puntos abren más juegos pequeños mientras persigues el patrón completo.',er:'<b>Faltan dos formas.</b> Una se esconde en un lugar de comida antes del mediodía. La última solo aparece en un lugar de música después de la medianoche.',again:'Jugar la demo otra vez',es:'Solo demo. Nada se guarda.',drag:'Sin sensor de movimiento. Arrastra para mirar alrededor.'}}[lang];
const $=s=>document.querySelector(s);
['tk','tp','tl','tw','ik','ih','ip','go','is','ek','eh','again','es'].forEach(k=>$('#'+k).textContent=T[k]);$('#er').innerHTML=T.er;

// ---- shapes (Soko motifs)
const SH=[
 {id:'petal',c:['#ffb8cb','#f68686'],draw(x,r){x.beginPath();x.moveTo(0,-r);x.bezierCurveTo(r*.95,-r*.45,r*.95,r*.45,0,r);x.bezierCurveTo(-r*.95,r*.45,-r*.95,-r*.45,0,-r);x.fill();x.globalAlpha*=.5;x.fillStyle='#fff';x.beginPath();x.ellipse(0,0,r*.16,r*.62,0,0,7);x.fill()}},
 {id:'tile',c:['#a597ff','#6f63c9'],draw(x,r){x.save();x.rotate(Math.PI/4);const s=r*.74;x.beginPath();x.roundRect(-s,-s,s*2,s*2,r*.2);x.fill();x.restore();x.strokeStyle='rgba(255,255,255,.8)';x.lineWidth=r*.09;x.beginPath();x.arc(0,0,r*.42,0,7);x.stroke();x.fillStyle='#fff';x.beginPath();x.arc(0,0,r*.13,0,7);x.fill()}},
 {id:'sun',c:['#ede77d','#f6c95a'],draw(x,r){for(let i=0;i<8;i++){x.save();x.rotate(i*Math.PI/4);x.beginPath();x.ellipse(0,-r*.74,r*.14,r*.26,0,0,7);x.fill();x.restore()}x.beginPath();x.arc(0,0,r*.5,0,7);x.fill()}},
 {id:'wave',c:['#8bdfff','#b0ef8b'],draw(x,r){x.beginPath();x.arc(0,0,r*.92,0,7);x.fill();x.strokeStyle='rgba(255,255,255,.85)';x.lineWidth=r*.11;x.lineCap='round';for(let j=-1;j<=1;j++){x.beginPath();for(let i=-6;i<=6;i++){const px=i*r*.1,py=j*r*.32+Math.sin(i*.9)*r*.1;i===-6?x.moveTo(px,py):x.lineTo(px,py)}x.stroke()}}},
 {id:'eye',c:['#ede77d','#ffb8cb'],draw(x,r){SH[0].draw(x,r)}}];
function paint(x,sh,r){const g=x.createLinearGradient(-r,-r,r,r);g.addColorStop(0,sh.c[0]);g.addColorStop(1,sh.c[1]);x.fillStyle=g;sh.draw(x,r)}
const slots=$('#slots');const ORDER=[0,1,2,3,4];
ORDER.forEach(i=>{const d=document.createElement('div');d.className='slot'+(i===4?' rare':'');const c=document.createElement('canvas');c.width=c.height=120;const x=c.getContext('2d');x.translate(60,60);paint(x,SH[i],50);d.appendChild(c);slots.appendChild(d)});

// ---- view + world
const cv=$('#cv'),ctx=cv.getContext('2d');let W=0,H=0,DPR=Math.min(2,devicePixelRatio||1);
function fit(){W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',fit);fit();
const V={yaw:0,pitch:0,ty:0,tp:0,gyro:false,base:null};
const wrap=d=>((d+540)%360)-180;
function onOri(e){if(e.alpha==null||e.beta==null)return;V.gyro=true;const heading=(typeof e.webkitCompassHeading==='number')?360-e.webkitCompassHeading:e.alpha;if(V.base==null)V.base=heading;V.ty=wrap(heading-V.base);V.tp=Math.max(-60,Math.min(60,e.beta-80))}
let drag=null;cv.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY]});addEventListener('pointerup',()=>drag=null);
addEventListener('pointermove',e=>{if(!drag||V.gyro)return;V.ty=wrap(V.ty+(e.clientX-drag[0])*.22);V.tp=Math.max(-50,Math.min(50,V.tp+(e.clientY-drag[1])*.18));drag=[e.clientX,e.clientY]});

// ---- audio
let AC=null;function tone(f,d,g,type,to){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),a=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);a.gain.setValueAtTime(0,t);a.gain.linearRampToValueAtTime(g,t+.01);a.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(a).connect(AC.destination);o.start(t);o.stop(t+d+.02)}
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};

// ---- game
const G={on:false,i:0,pts:0,got:[],sh:null,charge:0,inRing:false,msgT:0,fly:null,parts:[],t:0,seen:false};
function hint(s){const h=$('#hint');h.style.opacity=0;setTimeout(()=>{h.textContent=s;h.style.opacity=1},180)}
function spawn(){const far=G.i===0?55:80+Math.random()*60,dir=Math.random()<.5?-1:1;G.sh={k:G.i,yaw:wrap(V.yaw+dir*far),pitch:-12+Math.random()*26,vy:0,vp:0,ph:Math.random()*9,born:G.t};G.charge=0;G.seen=false;hint(G.i?T.next:T.find)}
function caught(){const s=G.sh,p=proj(s);G.fly={k:s.k,x:p.x,y:p.y,t:0};G.sh=null;const add=50+G.i*25;G.pts+=add;$('#pts').textContent=G.pts;G.got.push(s.k);
 for(let i=0;i<26;i++){const a=Math.random()*7,sp=1+Math.random()*5;G.parts.push({x:p.x,y:p.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,l:1,c:SH[s.k].c[i%2]})}
 [0,4,7,12].forEach((n,i)=>setTimeout(()=>tone(440*Math.pow(2,n/12),.5,.12),i*70));buzz([20,40,60]);hint(T.got[G.i%3]+'  +'+add);
 G.i++;setTimeout(()=>{if(G.i>=3)finish();else spawn()},1500)}
function finish(){G.on=false;$('#ep').textContent=T.ep.replace('{p}',G.pts);$('#end').classList.remove('off')}
function proj(s){const k=W/52;return{x:W/2-wrap(s.yaw-V.yaw)*k,y:H*.45-(s.pitch-V.pitch)*k}}
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;G.t+=dt;requestAnimationFrame(loop);
 V.yaw=wrap(V.yaw+wrap(V.ty-V.yaw)*Math.min(1,dt*10));V.pitch+=(V.tp-V.pitch)*Math.min(1,dt*10);
 ctx.clearRect(0,0,W,H);const cx=W/2,cy=H*.45,R=Math.min(W,H)*.2;
 const s=G.sh;let d=9999,p=null;
 if(s&&G.on){ // wriggle: calmer at first, livelier as you charge and with each shape
  const live=(.5+G.i*.35)*(1+G.charge*1.6);s.vy+=(Math.sin(G.t*1.3+s.ph)*14*live-s.vy*1.2)*dt;s.vp+=(Math.cos(G.t*1.7+s.ph*2)*9*live-s.vp*1.2)*dt;
  if(G.inRing&&Math.random()<dt*(.5+G.i*.5)){s.vy+=(Math.random()-.5)*60*live;s.vp+=(Math.random()-.5)*34*live}
  s.yaw=wrap(s.yaw+s.vy*dt);s.pitch=Math.max(-28,Math.min(28,s.pitch+s.vp*dt));
  p=proj(s);d=Math.hypot(p.x-cx,p.y-cy);const was=G.inRing;G.inRing=d<R*.95;
  if(G.inRing){if(!was){tone(520,.12,.05);if(!G.seen){G.seen=true;hint(T.hold)}}G.charge+=dt/(1.5+G.i*.35);if(Math.random()<dt*14)buzz(6)}else{if(was&&G.charge>.15){hint(T.slip);tone(300,.25,.05,'sine',180)}G.charge=Math.max(0,G.charge-dt*.5)}
  if(G.charge>=1){caught()}}
 // ring
 ctx.lineWidth=2;ctx.strokeStyle='rgba(255,255,255,'+(G.inRing?.9:.45)+')';ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.stroke();
 if(G.charge>0&&G.sh){ctx.lineWidth=6;ctx.lineCap='round';ctx.strokeStyle=SH[G.sh.k].c[0];ctx.beginPath();ctx.arc(cx,cy,R+7,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.min(1,G.charge));ctx.stroke()}
 // shape
 if(G.sh&&p){const on=p.x>-60&&p.x<W+60&&p.y>-60&&p.y<H+60,r=Math.min(W,H)*.105*(1+Math.sin(G.t*3+s.ph)*.05)*(1-G.charge*.18),ap=Math.min(1,(G.t-s.born)/.6);
  if(on){ctx.save();ctx.translate(p.x,p.y+Math.sin(G.t*2+s.ph)*6);ctx.globalAlpha=ap;const gl=ctx.createRadialGradient(0,0,0,0,0,r*2.4);gl.addColorStop(0,'rgba(255,255,255,.35)');gl.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=gl;ctx.beginPath();ctx.arc(0,0,r*2.4,0,7);ctx.fill();
   ctx.rotate(Math.sin(G.t*1.4+s.ph)*.35+(G.inRing?Math.sin(G.t*30)*.06*G.charge*3:0));ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=18;ctx.shadowOffsetY=8;paint(ctx,SH[s.k],r);ctx.restore()}
  else{const a=Math.atan2(p.y-cy,p.x-cx),ex=Math.max(34,Math.min(W-34,cx+Math.cos(a)*W)),ey=Math.max(120,Math.min(H-190,cy+Math.sin(a)*H));ctx.save();ctx.translate(ex,ey);ctx.rotate(a);ctx.globalAlpha=.6+.4*Math.sin(G.t*6);ctx.fillStyle=SH[s.k].c[0];ctx.beginPath();ctx.moveTo(14,0);ctx.lineTo(-8,-10);ctx.lineTo(-3,0);ctx.lineTo(-8,10);ctx.closePath();ctx.fill();ctx.restore()}}
 // fly to tray
 if(G.fly){const f=G.fly;f.t+=dt/.7;const el=slots.children[f.k].getBoundingClientRect(),tx=el.left+el.width/2,ty=el.top+el.height/2,e=1-Math.pow(1-Math.min(1,f.t),3),x=f.x+(tx-f.x)*e,y=f.y+(ty-f.y)*e-Math.sin(e*Math.PI)*60,r=Math.min(W,H)*.105*(1-e*.6);ctx.save();ctx.translate(x,y);ctx.rotate(e*6);paint(ctx,SH[f.k],r);ctx.restore();if(f.t>=1){slots.children[f.k].classList.add('got');$('#tc').textContent=G.got.length+' / 5';tone(880,.3,.08);G.fly=null}}
 G.parts=G.parts.filter(q=>(q.l-=dt*1.4)>0);for(const q of G.parts){q.x+=q.vx;q.y+=q.vy;q.vy-=.04;ctx.globalAlpha=q.l;ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x,q.y,3+q.l*4,0,7);ctx.fill()}ctx.globalAlpha=1}
requestAnimationFrame(loop);

async function start(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}
 try{if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission){const r=await DeviceOrientationEvent.requestPermission();if(r==='granted')addEventListener('deviceorientation',onOri)}else addEventListener('deviceorientation',onOri)}catch(e){}
 try{const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});$('#cam').srcObject=st;await $('#cam').play().catch(()=>{})}catch(e){$('#cam').style.display='none';$('#fb').style.display='block'}
 $('#intro').classList.add('off');reset();setTimeout(()=>{if(!V.gyro)hint(T.drag)},2600)}
function reset(){G.on=true;G.i=0;G.pts=0;G.got=[];G.parts=[];G.fly=null;$('#pts').textContent='0';$('#tc').textContent='0 / 5';[...slots.children].forEach(c=>c.classList.remove('got'));$('#end').classList.add('off');spawn()}
$('#go').onclick=start;$('#again').onclick=reset;$('#tc').textContent='0 / 5';
window.__h={G,V,proj};
</script></body></html>
